<footer aria-labelledby="contacto-title">
  <span id="contacto" class="anchor"></span>
  <div class="page indent contact">
    <h2 id="contacto-title">{{ 'contact.title' | i18nextEager }}</h2>
    <a class="mail" [href]="'mailto:' + profile.email">{{ profile.email }}</a>

    <div class="links">
      <a class="phone mono" [href]="tel">{{ profile.phone }}</a>
      <a
        class="social"
        aria-label="GitHub"
        [href]="profile.github"
        target="_blank"
        rel="noopener noreferrer"
      >
        <app-icon name="github" />
      </a>
      <a
        class="social"
        aria-label="LinkedIn"
        [href]="profile.linkedin"
        target="_blank"
        rel="noopener noreferrer"
      >
        <app-icon name="linkedin" />
      </a>
      <a class="btn btn--outline" [href]="lang.cv()" download>
        <app-icon name="download" />
        {{ 'actions.downloadCv' | i18nextEager }}
      </a>
    </div>
  </div>

  <div class="page indent">
    <p class="legal">&copy; {{ year }} {{ 'hero.name' | i18nextEager }}</p>
  </div>
</footer>
