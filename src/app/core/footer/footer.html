<footer class="relative w-full py-8 text-gray-400"> 
  <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-gray-600 to-transparent opacity-50"></div>
  <div class="max-w-5xl mx-auto px-6 flex flex-wrap items-center justify-center gap-x-8 gap-y-4 text-sm font-light">
    <span class="text-gray-500 cursor-default">Contáctame</span>
    <a [href]="github" target="_blank" rel="noopener noreferrer" 
       class="transition-colors duration-300 hover:text-white">
      GitHub
    </a>
    <a [href]="linkedin" target="_blank" rel="noopener noreferrer" 
       class="transition-colors duration-300 hover:text-white">
      LinkedIn
    </a>
    <a [href]="'mailto:' + email" 
        class="transition-colors duration-300 hover:text-white"
        aria-label="Enviar correo electrónico">

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
        </svg>
    </a>
    <span class="text-gray-700 hidden md:block">|</span>
    <button (click)="copyNum()"
            class="transition-colors duration-300 hover:text-white">
        @if (isCopied) {
           <span class="text-teal-400 font-medium">¡Copiado!</span>
        } @else {
            <span>{{ numTelefono }}</span>
        }
    </button>
  </div>
</footer>
