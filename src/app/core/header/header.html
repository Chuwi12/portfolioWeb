<header class="fixed top-0 w-full bg-background/80 backdrop-blur-md border-b border-surface-border shadow-sm z-50 left-0 right-0 transition-colors duration-300 safe-top safe-x">
  <div class="flex justify-between items-center max-w-container-max mx-auto px-gutter h-16 sm:h-20 w-full">
    <a href="#" class="font-headline-md text-headline-md font-bold text-primary hover:opacity-80 transition-opacity">
      Chuwi-dev
    </a>

    <div class="flex items-center gap-4 sm:gap-6">
      <nav class="hidden md:flex gap-6 lg:gap-8 items-center">
        @for (link of navLinks; track link.name) {
          <a [href]="link.url" 
             [ngClass]="activeSection() === link.url.substring(1) ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant hover:text-secondary transition-all duration-300'"
             class="font-label-md text-label-md uppercase tracking-wider">
            {{ link.name | i18nextEager }}
          </a>
        }
      </nav>

      <div class="hidden md:block w-px h-6 bg-surface-border transition-colors duration-300"></div>

      <div class="hidden md:flex items-center gap-4 text-on-surface-variant">
        <a aria-label="GitHub" [href]="github" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors">
          <svg class="w-[18px] h-[18px] fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path></svg>
        </a>
        <a aria-label="LinkedIn" [href]="linkedin" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors">
          <svg class="w-[18px] h-[18px] fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path></svg>
        </a>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Available for Work Badge -->
        <div class="flex items-center px-2 py-1 sm:px-3 rounded-full border border-primary/30 bg-primary/10 transition-colors duration-300">
          <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-primary animate-pulse mr-1.5 sm:mr-2"></span>
          <span class="font-label-sm text-[9px] sm:text-[10px] text-primary uppercase tracking-wider whitespace-nowrap">{{ 'header.openToWork' | i18nextEager }}</span>
        </div>

        <button (click)="toggleTheme()" class="min-w-11 min-h-11 flex items-center justify-center text-on-surface-variant hover:text-primary transition-transform hover:scale-110 touch-feedback rounded-lg">
          @if (isDarkMode()) {
            <span class="material-symbols-outlined text-xl">light_mode</span>
          } @else {
            <span class="material-symbols-outlined text-xl">dark_mode</span>
          }
        </button>

        <!-- Language Toggle Button -->
        <button (click)="toggleLanguage()" 
                class="min-w-11 min-h-11 flex items-center justify-center px-3 py-1 rounded border border-primary/30 text-[11px] font-bold uppercase tracking-wider text-primary hover:scale-105 hover:bg-primary/10 transition-all cursor-pointer touch-feedback"
                title="Cambiar idioma">
          {{ currentLang() }}
        </button>

        <a class="hidden md:inline-flex bg-primary-container text-text-primary px-5 py-2 rounded font-label-md text-[13px] hover:bg-secondary transition-colors active:scale-95 transition-transform" href="/CV.pdf" target="_blank">
          Resume
        </a>

        <button (click)="toggleMenu()" class="md:hidden min-w-11 min-h-11 flex items-center justify-center text-primary focus:outline-none transition-colors duration-300 touch-feedback rounded-lg">
          <span class="material-symbols-outlined text-3xl">
            {{ isMenuOpen() ? 'close' : 'menu' }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu with animation -->
  <div class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
       [style.max-height]="isMenuOpen() ? '400px' : '0px'"
       [style.opacity]="isMenuOpen() ? '1' : '0'">
    <div class="bg-surface-card border-b border-surface-border transition-colors duration-300">
      <nav class="flex flex-col px-6 py-6 gap-1">
        @for (link of navLinks; track link.name) {
          <a [href]="link.url" (click)="toggleMenu()" 
             [ngClass]="activeSection() === link.url.substring(1) ? 'text-primary font-bold bg-primary/5' : 'text-on-surface-variant'"
             class="block py-3 px-4 text-lg font-headline-md hover:text-secondary active:text-secondary active:bg-primary/5 transition-colors rounded-lg">
            {{ link.name | i18nextEager }}
          </a>
        }
        <a class="inline-flex justify-center bg-primary-container text-text-primary px-5 py-3 rounded font-label-md hover:bg-secondary transition-colors mt-4 active:scale-95" href="/CV.pdf" target="_blank">
          Resume
        </a>
      </nav>
    </div>
  </div>
</header>
