<header class="bar" (keydown.escape)="menuOpen.set(false)">
  <div class="page bar-in">
    <a class="brand" routerLink="/" (click)="menuOpen.set(false)">chuwi-dev</a>

    <button
      class="tool menu-btn"
      type="button"
      aria-controls="menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="(menuOpen() ? 'header.menuClose' : 'header.menuOpen') | i18nextEager"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>

    <nav
      id="menu"
      class="nav"
      [class.is-open]="menuOpen()"
      [attr.aria-label]="'header.mainNav' | i18nextEager"
    >
      <div class="links">
        @for (link of links; track link.href) {
          <a [href]="link.href" (click)="menuOpen.set(false)">{{ link.label | i18nextEager }}</a>
        }
      </div>
      <div class="tools">
        <button
          class="tool mono"
          type="button"
          [attr.aria-label]="'header.langLabel' | i18nextEager"
          (click)="lang.toggle()"
        >
          {{ 'header.langCode' | i18nextEager }}
        </button>
        <button
          class="tool"
          type="button"
          [attr.aria-label]="
            (theme.dark() ? 'header.themeLight' : 'header.themeDark') | i18nextEager
          "
          (click)="theme.toggle()"
        >
          <app-icon class="theme-sun" name="sun" />
          <app-icon class="theme-moon" name="moon" />
        </button>
      </div>
    </nav>

    <a class="btn btn--primary cv" [href]="lang.cv()" download>
      <app-icon name="download" />
      {{ 'actions.downloadCv' | i18nextEager }}
    </a>
  </div>
</header>
