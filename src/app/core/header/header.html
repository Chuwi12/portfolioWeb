<header class="fixed top-0 left-0 w-full z-50 bg-gray-950/80 backdrop-blur-md border-b border-white/5">
  <nav class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
    
    <a href="#" class="text-2xl font-extrabold text-white tracking-tighter hover:opacity-80 transition-opacity">
      CHUWI<span class="text-teal-400">-DEV</span>
    </a>

    <div class="flex items-center gap-6">
      
      <ul class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.name) {
          <li>
            <a [href]="link.url" 
               [class.text-teal-400]="link.name === 'Contacto'"
               [class.text-gray-300]="link.name !== 'Contacto'"
               class="text-sm font-medium hover:text-teal-400 transition-colors uppercase tracking-widest">
              {{ link.name }}
            </a>
          </li>
        }
      </ul>

      <div class="hidden md:block w-px h-6 bg-white/10"></div>

      <div class="flex items-center gap-4">h
        <button (click)="toggleTheme()" class="text-gray-300 hover:text-teal-400 transition-transform hover:scale-110">
          @if (isDarkMode()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
          }
        </button>

      </div>

      <button (click)="toggleMenu()" class="md:hidden text-gray-300 focus:outline-none ml-2">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          @if (!isMobileMenuOpen) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          }
        </svg>
      </button>

    </div>
  </nav>

  @if (isMobileMenuOpen) {
    <div class="md:hidden bg-gray-900 border-b border-white/10 absolute w-full">
      <ul class="flex flex-col px-6 py-6 gap-5">
        @for (link of navLinks; track link.name) {
          <li>
            <a [href]="link.url" (click)="toggleMenu()" 
               class="block text-lg font-medium text-gray-300 active:text-teal-400">
              {{ link.name }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
