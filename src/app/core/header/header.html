<header class="fixed top-0 w-full bg-[#030712]/80 backdrop-blur-md border-b border-white/10 shadow-sm z-50 left-0 right-0 transition-colors duration-300">
  <div class="flex justify-between items-center max-w-container-max mx-auto px-gutter h-20 w-full">
    <a href="#" class="font-headline-md text-headline-md font-bold text-primary hover:opacity-80 transition-opacity">
      Chuwi-dev
    </a>

    <div class="flex items-center gap-6">
      <nav class="hidden md:flex gap-8 items-center">
        @for (link of navLinks; track link.name) {
          <a [href]="link.url" 
             [ngClass]="activeSection() === link.url.substring(1) ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant hover:text-secondary transition-all duration-300'"
             class="font-label-md text-label-md uppercase tracking-wider">
            {{ link.name | i18nextEager }}
          </a>
        }
      </nav>

      <div class="hidden md:block w-px h-6 bg-surface-border transition-colors duration-300"></div>

      <div class="flex items-center gap-4">
        <!-- Available for Work Badge -->
        <div class="hidden sm:flex items-center px-3 py-1 rounded-full border border-primary/30 bg-primary/10 transition-colors duration-300">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse mr-2"></span>
          <span class="font-label-sm text-[10px] text-primary uppercase tracking-wider whitespace-nowrap">{{ 'header.openToWork' | i18nextEager }}</span>
        </div>

        <button (click)="toggleTheme()" class="text-on-surface-variant hover:text-primary transition-transform hover:scale-110">
          @if (isDarkMode()) {
            <span class="material-symbols-outlined text-xl">light_mode</span>
          } @else {
            <span class="material-symbols-outlined text-xl">dark_mode</span>
          }
        </button>

        <!-- Language Toggle Button -->
        <button (click)="toggleLanguage()" 
                class="flex items-center justify-center px-3 py-1 rounded border border-primary/30 text-[11px] font-bold uppercase tracking-wider text-primary hover:scale-105 hover:bg-primary/10 transition-all cursor-pointer"
                title="Cambiar idioma">
          {{ currentLang() }}
        </button>

        <a class="hidden md:inline-flex bg-primary-container text-text-primary px-5 py-2 rounded font-label-md text-[13px] hover:bg-secondary transition-colors active:scale-95 transition-transform" href="/CV.pdf" target="_blank">
          Resume
        </a>

        <button (click)="toggleMenu()" class="md:hidden text-primary focus:outline-none ml-2 transition-colors duration-300">
          <span class="material-symbols-outlined text-3xl">
            {{ isMobileMenuOpen ? 'close' : 'menu' }}
          </span>
        </button>
      </div>
    </div>
  </div>

  @if (isMobileMenuOpen) {
    <div class="md:hidden bg-surface-card border-b border-surface-border absolute w-full transition-colors duration-300">
      <nav class="flex flex-col px-6 py-6 gap-5">
        @for (link of navLinks; track link.name) {
          <a [href]="link.url" (click)="toggleMenu()" 
             [ngClass]="activeSection() === link.url.substring(1) ? 'text-primary font-bold' : 'text-on-surface-variant'"
             class="inline-block py-1 text-lg font-headline-md hover:text-secondary active:text-secondary transition-colors">
            {{ link.name | i18nextEager }}
          </a>
        }
        <a class="inline-flex justify-center bg-primary-container text-text-primary px-5 py-3 rounded font-label-md hover:bg-secondary transition-colors mt-4" href="/CV.pdf" target="_blank">
          Resume
        </a>
      </nav>
    </div>
  }
</header>
