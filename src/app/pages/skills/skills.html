<section class="max-w-container-max mx-auto px-gutter w-full">
  <div class="text-center mb-12">
    <h2 class="font-headline-lg text-headline-lg text-text-primary mb-4 flex items-center justify-center gap-4">
      <span class="text-primary font-label-md text-label-md tracking-wider uppercase">02.</span> <span [innerHTML]="'skills.title' | i18nextEager"></span>
    </h2>
    <p class="font-label-sm text-label-sm text-text-muted">{{ 'skills.filterHelp' | i18nextEager }}</p>
  </div>
  <div class="flex flex-wrap justify-center gap-4 max-w-4xl mx-auto">
    @for (skill of skillList; track skill) {
      <button 
        (click)="toggleFilter(skill)"
        class="flex items-center gap-2 px-6 py-3 rounded-full font-label-md text-label-md transition-all duration-300 group"
        [ngClass]="activeFilters().includes(skill) 
        ? 'bg-surface-card border border-primary text-primary shadow-[0_0_15px_rgba(20,184,166,0.2)] scale-105' 
        : 'bg-surface-card border border-surface-border text-text-muted hover:border-primary hover:text-primary hover:-translate-y-1'">
        <app-icon [name]="skill.toLowerCase()" class="w-5 h-5 transition-transform group-hover:scale-110"></app-icon>
        {{ skill }}
      </button>
    }
  </div>
</section>
