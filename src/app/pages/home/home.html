<section class="page grid-row head" style="--i: 0">
  <div class="g" aria-hidden="true">
    <i class="lane0"></i>
    <img
      class="avatar"
      src="/avatar-face.webp"
      alt=""
      width="116"
      height="116"
      fetchpriority="high"
    />
  </div>

  <div>
    <p class="refs">
      <span class="pill pill--fill mono">HEAD -> main</span>
      <span class="pill mono">open-to-work</span>
      <span class="mono place">Madrid</span>
    </p>
    <h1>{{ 'hero.name' | i18nextEager }}</h1>
    <p class="role">{{ 'hero.role' | i18nextEager }}</p>
    <p class="pitch">{{ 'hero.pitch' | i18nextEager }}</p>
    <div class="actions">
      <a class="btn btn--primary" [href]="lang.cv()" download>
        <app-icon name="download" />
        {{ 'actions.downloadCv' | i18nextEager }}
      </a>
      <a class="btn btn--outline" [href]="mailto">
        <app-icon name="mail" />
        {{ 'actions.writeMe' | i18nextEager }}
      </a>
    </div>
  </div>
</section>

<app-stack />
<app-history />
