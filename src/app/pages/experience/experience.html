<section id="experiencia" class="py-20 px-6 bg-white dark:bg-gray-900 transition-colors duration-300">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-blue-600 dark:text-blue-400 font-mono text-sm mb-4 uppercase tracking-widest transition-colors duration-300">Trayectoria</h2>
      <h3 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white transition-colors duration-300">
        Experiencia <span class="text-blue-600 dark:text-blue-400">Laboral</span>
      </h3>
    </div>

    <div class="space-y-0">
      @for (exp of experiences; track exp.company) {
        <app-experience-item
          [position]="exp.position"
          [company]="exp.company"
          [duration]="exp.duration"
          [description]="exp.description">
        </app-experience-item>
      }
    </div>
  </div>
</section>
