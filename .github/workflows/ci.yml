name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: 'bun'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prettier
        run: bun run format:check
      - name: Test
        run: bun run test --watch=false
      - name: Build
        run: bun run build
      - name: CSP
        run: node scripts/check-csp.mjs
